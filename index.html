<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionario: Heurísticas, Agentes y Principios de IA</title>
<style>
:root{
  --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --text:#e8ecf5; --muted:#8b95ad;
  --accent:#5b8def; --good:#3fbf7f; --bad:#e2564f; --border:#2a3450;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5fb; --panel:#ffffff; --panel2:#eef1fa; --text:#1c2333; --muted:#606b85;
    --accent:#3f6fd8; --good:#1e9a5c; --bad:#c8362f; --border:#dbe1f2;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --text:#e8ecf5; --muted:#8b95ad;
  --accent:#5b8def; --good:#3fbf7f; --bad:#e2564f; --border:#2a3450;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Georgia',ui-serif,serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:680px; margin:0 auto; padding:32px 20px 60px;}
h1{font-size:1.5rem; margin:0 0 4px; line-height:1.3;}
.subtitle{color:var(--muted); font-family:ui-sans-serif,system-ui,sans-serif; font-size:.92rem; margin:0 0 28px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:24px; margin-bottom:20px;}
.meta{display:flex; justify-content:space-between; align-items:center; font-family:ui-sans-serif,system-ui,sans-serif; font-size:.8rem; color:var(--muted); margin-bottom:14px;}
.tag{background:var(--panel2); padding:3px 10px; border-radius:20px; border:1px solid var(--border);}
.question{font-size:1.15rem; line-height:1.5; margin-bottom:18px;}
.options{display:flex; flex-direction:column; gap:10px;}
.opt{
  font-family:ui-sans-serif,system-ui,sans-serif; text-align:left; font-size:.98rem;
  background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:13px 16px; border-radius:8px; cursor:pointer; line-height:1.4;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.opt.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 15%, var(--panel2));}
.opt.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 15%, var(--panel2));}
.opt:disabled{cursor:default;}
.explain{font-family:ui-sans-serif,system-ui,sans-serif; font-size:.88rem; color:var(--muted); margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); display:none;}
.explain.show{display:block;}
.nav{display:flex; justify-content:space-between; margin-top:20px; font-family:ui-sans-serif,system-ui,sans-serif;}
button.primary, button.ghost{
  font-family:inherit; font-size:.92rem; padding:10px 20px; border-radius:8px; cursor:pointer; border:1px solid var(--border);
}
button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
button.primary:disabled{opacity:.4; cursor:not-allowed;}
button.ghost{background:transparent; color:var(--text);}
.progress{height:6px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-bottom:24px;}
.progress-bar{height:100%; background:var(--accent); transition:width .25s;}
.result{text-align:center;}
.result .score{font-size:3rem; margin:6px 0;}
.result .score span{font-size:1.5rem; color:var(--muted);}
.review-item{text-align:left; border-top:1px solid var(--border); padding:14px 0; font-family:ui-sans-serif,system-ui,sans-serif;}
.review-item .q{font-family:'Georgia',serif; font-size:1rem; margin-bottom:6px;}
.review-item .a{font-size:.86rem; margin:2px 0;}
.review-item .a.correct{color:var(--good);}
.review-item .a.incorrect{color:var(--bad);}
.badge{font-family:ui-sans-serif,system-ui,sans-serif; font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
.start-screen{text-align:center;}
.start-screen p{color:var(--muted); font-family:ui-sans-serif,system-ui,sans-serif; line-height:1.6;}
.filters{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:18px 0 6px; font-family:ui-sans-serif,system-ui,sans-serif;}
.filters label{font-size:.85rem; background:var(--panel2); border:1px solid var(--border); padding:8px 14px; border-radius:20px; cursor:pointer; color:var(--text);}
.filters input{margin-right:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Heurísticas, Agentes y Principios de IA</h1>
  <p class="subtitle">Cuestionario de estudio · basado en las dos presentaciones a estudiar</p>

  <div id="app"></div>
</div>

<script>
const QUESTIONS = [
// --- Heurísticas y Agentes ---
{q:"¿Qué es una heurística según la definición vista en clase?", opts:["Una regla o estimación práctica que ayuda a decidir qué camino explorar primero, sin garantizar la solución óptima","Un algoritmo que siempre encuentra la solución óptima con certeza matemática","Una base de datos de todas las soluciones posibles a un problema","Un tipo de red neuronal profunda"], correct:0, explain:"La heurística acelera la búsqueda a cambio de no garantizar la solución óptima."},
{q:"En el ejemplo del 8-puzzle mencionado en la presentación, ¿cuántos estados posibles existen?", opts:["1,000","181,440","8,192","50,000"], correct:1, explain:"Se usó como ejemplo de cómo crece explosivamente el espacio de búsqueda."},
{q:"¿Qué caracteriza a la búsqueda ciega (fuerza bruta)?", opts:["Usa una estimación de qué tan cerca está la meta","Explora todas las opciones sin criterio, funciona pero es lenta e ineficiente","Solo funciona en problemas pequeños de menos de 10 estados","Requiere aprendizaje por refuerzo"], correct:1, explain:"La búsqueda ciega no usa ninguna guía, por eso es ineficiente en problemas grandes."},
{q:"¿Cuál es la fórmula de Greedy Best-First Search?", opts:["f(n) = g(n) + h(n)","f(n) = h(n)","f(n) = g(n) - h(n)","f(n) = g(n) × h(n)"], correct:1, explain:"Greedy Best-First elige siempre el nodo que parece más cercano a la meta usando solo h(n)."},
{q:"¿Cuál es la fórmula del algoritmo A*?", opts:["f(n) = h(n)","f(n) = g(n)","f(n) = g(n) + h(n)","f(n) = g(n) / h(n)"], correct:2, explain:"A* combina el costo real recorrido g(n) con el costo heurístico estimado h(n)."},
{q:"En la fórmula de A*, ¿qué representa g(n)?", opts:["El costo estimado total","El costo real recorrido desde el inicio hasta n","Una estimación de lo que falta hasta la meta","La prioridad final del nodo"], correct:1, explain:"g(n) es lo que ya sabemos con certeza: la distancia real recorrida."},
{q:"En la fórmula de A*, ¿qué representa h(n)?", opts:["El costo real recorrido","La prioridad que usa el algoritmo","Una estimación de lo que falta recorrer desde n hasta la meta","El número total de nodos explorados"], correct:2, explain:"h(n) es el costo heurístico estimado hacia la meta."},
{q:"Según la presentación, ¿cuál es una desventaja de Greedy Best-First frente a A*?", opts:["Usa más memoria que A*","No garantiza el camino más corto y puede quedar atrapado en rutas engañosas","No es rápido en la práctica","No se usa en videojuegos"], correct:1, explain:"Greedy es rápido pero, al ignorar g(n), puede seguir rutas que parecen buenas pero no lo son."},
{q:"¿Qué significa que una heurística sea 'admisible'?", opts:["Que siempre sobreestima el costo real","Que nunca sobreestima el costo real de llegar a la meta (h(n) ≤ costo real)","Que solo funciona con búsqueda ciega","Que requiere aprendizaje supervisado"], correct:1, explain:"La admisibilidad garantiza que A* encuentre la solución óptima."},
{q:"¿Qué significa que una heurística sea 'consistente'?", opts:["Que el costo estimado nunca decrece de forma inconsistente entre nodos vecinos","Que siempre da el mismo resultado sin importar el problema","Que no necesita ser admisible","Que solo aplica a agentes reactivos"], correct:0, explain:"La consistencia evita que el algoritmo tenga que reexplorar nodos innecesariamente."},
{q:"Según la presentación, A* encuentra la ruta óptima si...", opts:["h(n) es igual a cero siempre","h(n) es admisible","se usa búsqueda ciega","el agente es reactivo simple"], correct:1, explain:"Una heurística admisible garantiza que A* sea óptimo."},
{q:"¿Qué es un agente inteligente según la definición dada?", opts:["Un programa que solo almacena datos sin actuar","Todo aquello que percibe su entorno mediante sensores y actúa mediante actuadores para alcanzar un objetivo","Una base de conocimiento estática","Un tipo de heurística admisible"], correct:1, explain:"El agente percibe, razona (con heurística) y actúa sobre su entorno."},
{q:"¿Qué significa el acrónimo PEAS mencionado en la presentación de agentes?", opts:["Percepciones, Entorno, Actuadores, Sensores","Proceso, Estado, Acción, Solución","Predicción, Evaluación, Aprendizaje, Sistema","Percepción, Estrategia, Algoritmo, Simulación"], correct:0, explain:"PEAS es el marco clásico para describir cualquier agente."},
{q:"¿Qué tipo de agente actúa solo según la percepción actual, sin memoria del pasado (ej. termostato)?", opts:["Basado en objetivos","Basado en utilidad","Reactivo simple","De aprendizaje"], correct:2, explain:"Los agentes reactivos simples no mantienen ningún estado interno del mundo."},
{q:"¿Qué tipo de agente mantiene un estado interno del mundo para manejar información no observable directamente?", opts:["Basado en modelos","Reactivo simple","De aprendizaje","Basado en utilidad"], correct:0, explain:"Los agentes basados en modelos guardan una representación interna del entorno."},
{q:"¿Qué tipo de agente, además del estado, considera una meta y planea acciones para alcanzarla?", opts:["Reactivo simple","Basado en objetivos","Basado en utilidad","De aprendizaje"], correct:1, explain:"Los agentes basados en objetivos planifican acciones orientadas a una meta concreta."},
{q:"¿Qué tipo de agente compara distintas soluciones y elige la que maximiza una medida de qué tan buena es (donde es clave la heurística)?", opts:["Basado en utilidad","Reactivo simple","Basado en modelos","De aprendizaje"], correct:0, explain:"El agente basado en utilidad usa una función heurística para evaluar y comparar opciones."},
{q:"¿Qué tipo de agente mejora su desempeño con la experiencia, ajustando su propia forma de decidir?", opts:["Basado en objetivos","De aprendizaje","Reactivo simple","Basado en modelos"], correct:1, explain:"El agente de aprendizaje modifica su comportamiento a partir de la experiencia."},
{q:"En el ciclo del agente (Percibir → Evaluar → Decidir → Actuar), ¿en qué paso vive la heurística?", opts:["Percibir","Evaluar","Actuar","Ninguno, no interviene en el ciclo"], correct:1, explain:"En el paso de evaluar, el agente aplica su función heurística para estimar qué tan buena es cada opción."},
{q:"Según los ejemplos del mundo real, ¿qué usan Waze y Google Maps para elegir la mejor ruta?", opts:["Solo búsqueda ciega","A* y variantes con heurísticas de distancia y tráfico en tiempo real","Redes neuronales convolucionales exclusivamente","Lógica difusa únicamente"], correct:1, explain:"La navegación GPS es uno de los ejemplos clásicos de A* aplicado en el mundo real."},
{q:"¿Qué combina un motor de ajedrez como Stockfish según la presentación?", opts:["Solo aprendizaje por refuerzo","Búsqueda (minimax) con funciones heurísticas de evaluación de tablero","Únicamente redes bayesianas","Solo búsqueda ciega"], correct:1, explain:"Stockfish combina minimax con una función heurística de evaluación."},
{q:"¿Cuál de las siguientes es una LIMITACIÓN de las heurísticas mencionada en la presentación?", opts:["Reducen drásticamente el tiempo de cómputo","No garantizan siempre la solución óptima","Se adaptan a distintos dominios","Son combinables con aprendizaje"], correct:1, explain:"Las heurísticas sacrifican la garantía de optimalidad a cambio de eficiencia."},
{q:"¿Cuál de las siguientes es una VENTAJA de las heurísticas mencionada en la presentación?", opts:["Diseñar una buena heurística requiere conocimiento del dominio","Puede quedar atrapada en óptimos locales","Permiten resolver problemas de otro modo intratables","Una heurística mal calibrada puede empeorar el resultado"], correct:2, explain:"Las heurísticas hacen tratables problemas que serían inviables por fuerza bruta."},

// --- Principios y Metodologías de IA ---
{q:"Según la evolución histórica presentada, ¿qué predominó en la etapa de 1950s–80s?", opts:["Aprendizaje profundo","Sistemas basados en reglas","IA generativa","Aprendizaje automático"], correct:1, explain:"Los sistemas basados en reglas (KBS/sistemas expertos) marcaron la primera etapa de la IA."},
{q:"¿Qué década se asocia con el auge del 'aprendizaje automático' en la línea de tiempo de la presentación?", opts:["1950s–80s","1990s–2000s","2010s","2020s"], correct:1, explain:"El aprendizaje automático se ubica en la etapa de 1990s–2000s, antes del deep learning y la IA generativa."},
{q:"¿Qué son los KBS (Knowledge Based Systems)?", opts:["Sistemas que reúnen el conocimiento de un experto humano y lo aplican mediante reglas simples ('si A, entonces B')","Redes neuronales de múltiples capas","Algoritmos de búsqueda ciega","Modelos de lenguaje generativo"], correct:0, explain:"A la capacidad de simular a un experto mediante estos sistemas se le llamó Sistema Experto."},
{q:"¿Cuál de estas NO es una de las cuatro formas simbólicas clásicas de representación del conocimiento mencionadas?", opts:["Lógica de primer orden","Frames (marcos)","Redes semánticas","Árboles de decisión"], correct:3, explain:"Las cuatro formas mencionadas son: lógica de primer orden, frames, redes semánticas y objetos."},
{q:"¿Qué representación del conocimiento usa 'grafos de conceptos unidos por relaciones' como 'es un' o 'parte de'?", opts:["Frames","Redes semánticas","Lógica de primer orden","Objetos"], correct:1, explain:"Las redes semánticas representan el conocimiento como grafos de conceptos relacionados."},
{q:"¿Cuáles son los cuatro pilares de un sistema inteligente según la presentación?", opts:["Percepción, memoria, actuación y comunicación","Representación del conocimiento, aprendizaje, razonamiento e inferencia, y percepción","Búsqueda, heurística, agentes y entornos","Supervisado, no supervisado, refuerzo y profundo"], correct:1, explain:"Estos cuatro pilares estructuran cómo un sistema inteligente codifica, aprende, razona y percibe."},
{q:"¿Qué tipo de IA 'resuelve una tarea específica' como traducir o recomendar, y es la única que existe hoy en la industria?", opts:["IA General (AGI)","Superinteligencia (ASI)","IA Estrecha (ANI)","IA simbólica"], correct:2, explain:"La ANI (Artificial Narrow Intelligence) es la única forma de IA confirmada como realidad operativa hoy."},
{q:"¿Qué tipo de IA 'igualaría la versatilidad cognitiva humana en cualquier tarea intelectual' pero no está confirmada como realidad?", opts:["IA Estrecha (ANI)","IA General (AGI)","Sistema experto","Aprendizaje por refuerzo"], correct:1, explain:"La AGI es un escenario aún no confirmado como realidad operativa."},
{q:"¿Cuántos principios éticos corporativos de IA se mencionan, adoptados desde 2018?", opts:["Tres","Cuatro","Cinco","Seis"], correct:2, explain:"Se mencionan cinco principios: IA justa, transparente y explicable, centrada en las personas, privacidad y seguridad desde el diseño, y trabajo con socios y terceros."},
{q:"¿Qué principio ético busca que 'el usuario sepa que interactúa con una IA, qué datos usa y por qué decide lo que decide'?", opts:["IA justa","Transparente y explicable","Centrada en las personas","Privacidad y seguridad desde el diseño"], correct:1, explain:"La transparencia y explicabilidad se refiere a que el usuario entienda el funcionamiento de la IA."},
{q:"¿Cuáles son las tres formas de aprender en Machine Learning según la presentación?", opts:["Simbólico, conexionista y evolutivo","Supervisado, no supervisado y por refuerzo","Profundo, superficial y difuso","Reactivo, deliberativo e híbrido"], correct:1, explain:"Estas son las tres metodologías clásicas de Machine Learning presentadas."},
{q:"¿Qué tipo de aprendizaje usa datos etiquetados (entrada → salida correcta), como detectar spam?", opts:["No supervisado","Por refuerzo","Supervisado","Profundo"], correct:2, explain:"El aprendizaje supervisado requiere ejemplos con la respuesta correcta ya conocida."},
{q:"¿Qué tipo de aprendizaje encuentra patrones y estructuras en datos sin etiquetas, como segmentar clientes?", opts:["Supervisado","No supervisado","Por refuerzo","Difuso"], correct:1, explain:"El aprendizaje no supervisado no requiere etiquetas, busca estructura en los datos."},
{q:"¿Qué tipo de aprendizaje se basa en que un agente aprenda por prueba y error, maximizando una recompensa (ej. robótica, juegos)?", opts:["Supervisado","No supervisado","Por refuerzo","Profundo"], correct:2, explain:"El aprendizaje por refuerzo optimiza el comportamiento mediante recompensas."},
{q:"¿Qué describe el 'sobreajuste' (overfitting)?", opts:["El modelo es demasiado simple y falla incluso con datos de entrenamiento","El modelo memoriza tan de cerca los datos de entrenamiento que pierde capacidad de predecir con datos nuevos","El modelo tiene sesgo alto y varianza baja","El modelo no requiere validación cruzada"], correct:1, explain:"El sobreajuste ocurre cuando el modelo se ajusta demasiado a los datos de entrenamiento."},
{q:"¿Qué describe el 'subajuste' (underfitting)?", opts:["El modelo memoriza los datos de entrenamiento perfectamente","El modelo es demasiado simple para captar los patrones reales, falla incluso en entrenamiento","El modelo tiene varianza alta","El modelo usa demasiadas capas ocultas"], correct:1, explain:"El subajuste ocurre cuando el modelo es demasiado simple para el problema."},
{q:"En el dilema sesgo-varianza, ¿qué produce el sesgo alto?", opts:["Sobreajuste","Subajuste","Validación cruzada perfecta","Aprendizaje por refuerzo"], correct:1, explain:"Sesgo alto produce subajuste; varianza alta produce sobreajuste."},
{q:"¿Qué es la 'ingeniería de características' (feature engineering)?", opts:["Dividir los datos en folds para evaluar el modelo","Crear, transformar y seleccionar variables que representen mejor el fenómeno a modelar","Comparar predicciones contra clases reales","Ajustar hiperparámetros antes del entrenamiento"], correct:1, explain:"La ingeniería de características prepara las variables (features) que usará el modelo."},
{q:"¿Qué es una 'matriz de confusión'?", opts:["Una técnica de validación cruzada","Una tabla que compara predicciones contra clases reales: aciertos, falsos positivos y falsos negativos","Un tipo de red neuronal","Un método de ajuste de hiperparámetros"], correct:1, explain:"La matriz de confusión evalúa el desempeño de un modelo de clasificación."},
{q:"¿Qué hace la 'validación cruzada'?", opts:["Ajusta los hiperparámetros automáticamente","Divide los datos en varios subconjuntos (folds) para evaluar el modelo de forma más robusta","Elimina el sobreajuste por completo","Convierte datos no supervisados en supervisados"], correct:1, explain:"La validación cruzada evalúa el modelo usando múltiples particiones de los datos."},
{q:"¿Qué son los 'hiperparámetros' según la presentación?", opts:["Los datos de salida del modelo","Configuraciones definidas antes del entrenamiento (tasa de aprendizaje, profundidad, etc.) que se optimizan","Las etiquetas del conjunto de entrenamiento","Los pesos finales de una red neuronal ya entrenada"], correct:1, explain:"Los hiperparámetros se configuran antes de entrenar y luego se ajustan/optimizan."},
{q:"¿Qué caracteriza al aprendizaje profundo (Deep Learning) según la presentación?", opts:["Usa redes neuronales artificiales con múltiples capas para aprender representaciones cada vez más complejas","Solo funciona con datos etiquetados manualmente","No requiere cómputo especializado","Es idéntico a la lógica difusa"], correct:0, explain:"El deep learning usa redes de múltiples capas inspiradas de forma abstracta en el cerebro."},
{q:"¿Qué modela la 'lógica difusa' (Fuzzy Logic)?", opts:["Solo valores binarios verdadero/falso","Conceptos imprecisos como 'alto' o 'cercano' en lugar de valores binarios","Redes neuronales profundas","Grafos dirigidos probabilísticos"], correct:1, explain:"La lógica difusa maneja la imprecisión, a diferencia de la lógica booleana estricta."},
{q:"¿Qué son las 'redes bayesianas'?", opts:["Estructuras tipo plantilla que agrupan atributos de un concepto","Modelos probabilísticos que relacionan variables aleatorias mediante un grafo dirigido","Un sinónimo de redes neuronales artificiales","Técnicas de búsqueda ciega"], correct:1, explain:"Las redes bayesianas representan relaciones probabilísticas entre variables mediante grafos dirigidos."},
{q:"¿Qué hace el 'razonamiento basado en casos'?", opts:["Genera reglas nuevas desde cero para cada problema","Resuelve problemas nuevos comparándolos con casos previos ya resueltos","Simula el juicio de un especialista sin usar datos previos","Requiere redes neuronales profundas obligatoriamente"], correct:1, explain:"Este enfoque reutiliza soluciones de casos anteriores similares."},
{q:"En el ciclo de vida de un proyecto de IA presentado, ¿cuál es el primer paso?", opts:["Modelar","Comprender el negocio","Evaluar","Desplegar y monitorear"], correct:1, explain:"El ciclo comienza definiendo el objetivo y la métrica de éxito del negocio."},
{q:"En el ciclo de vida de un proyecto de IA, ¿qué paso sigue después de 'Comprender y preparar los datos'?", opts:["Desplegar y monitorear","Comprender el negocio","Modelar","Evaluar"], correct:2, explain:"El orden es: comprender el negocio, comprender/preparar datos, modelar, evaluar, desplegar y monitorear."},
{q:"¿Cuál es el último paso del ciclo de vida de un proyecto de IA?", opts:["Modelar","Evaluar","Desplegar y monitorear","Comprender los datos"], correct:2, explain:"El ciclo cierra con poner en producción y vigilar el desempeño en el tiempo."},
{q:"Según la presentación, GPT-6 Astra fue lanzado por OpenAI ¿cuándo?", opts:["3 de septiembre de 2026","1 de enero de 2025","15 de junio de 2026","3 de septiembre de 2025"], correct:0, explain:"La presentación indica el 3 de septiembre de 2026 como fecha de lanzamiento."},
{q:"¿Con qué porcentaje logró GPT-6 Astra en FrontierMath Tier 4 según la presentación?", opts:["72.6%","97.6%","100%","99.9%"], correct:1, explain:"97.6% corresponde a FrontierMath Tier 4 (matemáticas de nivel experto)."},
{q:"Según la presentación, ¿qué usa un agente de IA para alcanzar objetivos concretos?", opts:["Solo bases de datos estáticas","Modelos de lenguaje: descompone tareas complejas en subtareas, planifica, usa herramientas y aprende de la experiencia","Únicamente búsqueda ciega","Solo redes bayesianas"], correct:1, explain:"La IA agéntica combina planificación, uso de herramientas y menor supervisión humana constante."},
{q:"Según la presentación, ¿el salto de GPT-6 Astra a la AGI es...?", opts:["Un hecho confirmado por toda la industria","Un debate abierto, ya que seguir siendo una IA estrecha (ANI) muy capaz no es lo mismo que AGI confirmada","Imposible según los autores","Ya superado por la superinteligencia (ASI)"], correct:1, explain:"La presentación deja claro que el debate sobre si Astra inicia la era AGI sigue abierto."},
{q:"¿Cuál de los siguientes se menciona como un RETO actual de la IA (no una tendencia)?", opts:["Modelos multimodales (texto, imagen, voz, video)","Sesgos ocultos en los datos de entrenamiento","Agentes autónomos que ejecutan tareas de varios pasos","Modelos más pequeños y especializados"], correct:1, explain:"Los sesgos ocultos, la falta de interpretabilidad, el alto costo computacional y los marcos regulatorios en construcción son los retos mencionados."},
{q:"¿Cuál de los siguientes se menciona como una TENDENCIA futura de la IA (no un reto)?", opts:["Falta de interpretabilidad de modelos complejos","Alto costo computacional y energético","IA aplicada a la ciencia: materiales, biología, clima","Marcos regulatorios aún en construcción"], correct:2, explain:"Las tendencias incluyen agentes autónomos, modelos multimodales, IA aplicada a la ciencia y modelos más eficientes."},
];

// ---------- App logic ----------
let order = [];
let current = 0;
let answers = []; // {qIdx, chosen, correct}

const app = document.getElementById('app');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  order = shuffle(QUESTIONS.map((_,i)=>i));
  current = 0;
  answers = [];
  renderQuestion();
}

function renderStart(){
  app.innerHTML = `
    <div class="card start-screen">
      <p><strong>${QUESTIONS.length} preguntas</strong> sobre "Heurísticas y Agentes en la IA" y "Principios y Metodologías de la IA". El orden de las preguntas y opciones se mezcla cada vez que empiezas, para que puedas repetir el examen tantas veces como quieras.</p>
      <button class="primary" id="startBtn">Comenzar cuestionario</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = startQuiz;
}

function renderQuestion(){
  const qIdx = order[current];
  const q = QUESTIONS[qIdx];
  const optOrder = shuffle(q.opts.map((_,i)=>i));
  const pct = Math.round((current/order.length)*100);

  app.innerHTML = `
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="meta"><span class="tag">Pregunta ${current+1} / ${order.length}</span></div>
      <div class="question">${q.q}</div>
      <div class="options" id="optionsWrap"></div>
      <div class="explain" id="explainBox"></div>
      <div class="nav">
        <button class="ghost" id="quitBtn">Reiniciar</button>
        <button class="primary" id="nextBtn" disabled>Siguiente</button>
      </div>
    </div>
  `;

  const optionsWrap = document.getElementById('optionsWrap');
  let chosen = null;

  optOrder.forEach(origIdx=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = q.opts[origIdx];
    btn.onclick = ()=>{
      if(chosen !== null) return;
      chosen = origIdx;
      const isCorrect = origIdx === q.correct;
      [...optionsWrap.children].forEach(c=>c.disabled = true);
      btn.classList.add(isCorrect ? 'correct' : 'incorrect');
      if(!isCorrect){
        [...optionsWrap.children].forEach(c=>{
          if(c.textContent === q.opts[q.correct]) c.classList.add('correct');
        });
      }
      document.getElementById('explainBox').classList.add('show');
      document.getElementById('explainBox').textContent = q.explain;
      document.getElementById('nextBtn').disabled = false;
      answers.push({qIdx, chosenText: q.opts[origIdx], correctText: q.opts[q.correct], isCorrect});
    };
    optionsWrap.appendChild(btn);
  });

  document.getElementById('nextBtn').onclick = ()=>{
    current++;
    if(current >= order.length){
      renderResults();
    } else {
      renderQuestion();
    }
  };
  document.getElementById('quitBtn').onclick = renderStart;
}

function renderResults(){
  const correctCount = answers.filter(a=>a.isCorrect).length;
  const total = answers.length;
  const pct = Math.round((correctCount/total)*100);

  const reviewHtml = answers.map(a=>{
    const q = QUESTIONS[a.qIdx];
    return `
      <div class="review-item">
        <div class="q">${q.q}</div>
        <div class="a ${a.isCorrect ? 'correct' : 'incorrect'}">Tu respuesta: ${a.chosenText}</div>
        ${!a.isCorrect ? `<div class="a correct">Correcta: ${a.correctText}</div>` : ''}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="card result">
      <div class="badge">Resultado</div>
      <div class="score">${correctCount}<span>/${total}</span></div>
      <p style="font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted)">${pct}% de aciertos</p>
      <button class="primary" id="retryBtn">Repetir cuestionario</button>
    </div>
    <div class="card">
      <div class="badge" style="margin-bottom:10px;display:block">Revisión</div>
      ${reviewHtml}
    </div>
  `;
  document.getElementById('retryBtn').onclick = startQuiz;
}

renderStart();
</script>
</body>
</html>
